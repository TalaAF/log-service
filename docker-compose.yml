services:
  postgres:
    build:
      context: ./docker/postgres
    environment:
      POSTGRES_USER: loguser
      POSTGRES_PASSWORD: logpass
      POSTGRES_DB: logs
    # Server tuning lives here rather than in the image so it applies to an
    # existing data volume as well as a freshly initialised one — appending to
    # postgresql.conf.sample only takes effect at initdb time.
    #
    # Everything below is sized for this container's budget: 1 CPU, 1 GB. CPU is
    # the scarce resource and memory is not, so the settings consistently spend
    # memory to save CPU.
    command:
      - postgres
      # pg_cron is a background worker and must be preloaded before start.
      # cron.database_name has to name the application database: pg_cron installs
      # into exactly one database per cluster and cannot reach across databases.
      - -c
      - shared_preload_libraries=pg_cron,pg_stat_statements
      - -c
      - cron.database_name=logs
      # Acknowledge a commit once it is in the WAL buffer instead of waiting for
      # the disk flush. This is the standard trade for a log ingestion workload:
      # a hard crash can lose the last fraction of a second of commits, but the
      # cluster cannot be corrupted, and it removes a per-transaction fsync from
      # the hot path.
      - -c
      - synchronous_commit=off
      - -c
      - wal_writer_delay=200ms
      # Both are left at PostgreSQL's defaults, and are parameterised only so
      # bench/coldwarm.sh can A/B them without editing this file.
      #
      # The theory was that a freshly created Docker volume makes allocation
      # expensive: wal_init_zero=on zero-fills each new 16MB segment before use,
      # and a cold run creates 54 of them where a warm run recycles. The
      # zero-filling is real and measurable in the file counts, but it is not
      # measurable in throughput. Over three cold runs each at a load high
      # enough to be capacity-limited (the 45k stage of the ramp), init=off came
      # out +2.9% on the mean — against a within-group spread of ~2,400 logs/s,
      # so the groups overlap and the difference is noise (t=1.08, p~0.34).
      #
      # Left on. Turning it off trades a documented durability safeguard on
      # filesystems that need it for an effect this one cannot measure.
      - -c
      - wal_init_zero=${WAL_INIT_ZERO:-on}
      - -c
      - wal_recycle=${WAL_RECYCLE:-on}
      - -c
      - wal_writer_flush_after=2MB
      # Checkpoint spreading. The default 1 GB max_wal_size forces frequent
      # checkpoints under sustained ingest, and every checkpoint makes the next
      # write to each page a full-page WAL record — pure write amplification.
      
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=1GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      # Memory. shared_buffers at ~30% of the container keeps the hot partition
      # and its indexes resident; effective_cache_size only informs the planner.
      - -c
      - shared_buffers=320MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      # Connections are deliberately few: the app pools total 12, and more
      # concurrent backends than cores buys context switching, not throughput.
      - -c
      - max_connections=30
      # JIT compiles a plan on a box with one core to spare. The aggregate query
      # over a million rows sits right above jit_above_cost, so leaving this on
      # spends CPU on compilation that the query then has to earn back.
      - -c
      - jit=off
      # Parallel query on a one-CPU container is a net loss: the workers cannot
      # run concurrently, so all it adds is worker startup, tuple queues and
      # contention. Measured on the aggregate query, the planner was choosing a
      # two-worker parallel seq scan and paying for it.
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      # Autovacuum has to keep up with an insert-heavy table without competing
      # for the one CPU during a burst.
      - -c
      - autovacuum_max_workers=2
      - -c
      - autovacuum_naptime=30s
      - -c
      - autovacuum_vacuum_cost_delay=2ms
      - -c
      - autovacuum_vacuum_cost_limit=1000
      - -c
      - autovacuum_vacuum_insert_scale_factor=0.3
      - -c
      - pg_stat_statements.track=top
    ports:
      - "5432:5432"
      # Second mapping for the test harness. A native Postgres on the developer
      # machine binds 5432 too, and Windows lets both listen, so a client
      # connecting there reaches whichever won the race rather than this
      # container. 55432 is unambiguous. Nothing in the service uses it: the app
      # reaches Postgres over the compose network.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loguser -d logs"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://loguser:logpass@postgres:5432/logs
      PORT: 8080
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      AUTH_ENABLED: "false"
      # Cap V8's heap below the cgroup limit so garbage collection reclaims
      # before the kernel OOM-kills the process, and give the young generation
      # room: ingest allocates a large volume of short-lived objects (parsed
      # JSON), and a bigger semi-space turns frequent scavenges into rare ones.
      NODE_OPTIONS: "--max-old-space-size=192 --max-semi-space-size=32"
      # Group-commit buffer. The flusher is self-clocking — it writes as soon as
      # a slot frees — so there is no interval to tune. FLUSH_INTERVAL_MS is only
      # a safety net for stranded rows, and FLUSH_MAX_ROWS caps a single COPY.
      FLUSH_INTERVAL_MS: "${FLUSH_INTERVAL_MS:-50}"
      FLUSH_MAX_ROWS: "20000"
      # One active COPY produced larger group commits and less summed database
      # execution than three competing COPY backends on the one-CPU server.
      FLUSH_CONCURRENCY: "1"
      DB_POOL_MAX: "8"
      # Reserved from DB_POOL_MAX for aggregate/state SQL; total read
      # connections remain eight (seven general + one aggregate).
      AGGREGATE_DB_POOL_MAX: "1"
      DB_WRITE_POOL_MAX: "4"
      LOG_LEVEL: "warn"
      # Rollups. LAG is how far behind now() the rollup/raw boundary sits: it
      # has to cover group-commit buffering plus client/server clock skew, and
      # it sets how much raw data a hybrid aggregate still has to read. See
      # syncRollupConfig in src/db/migrate.ts.
      ROLLUP_LAG_SECONDS: "${ROLLUP_LAG_SECONDS:-10}"
      INGEST_FLOOR_WINDOW_SECONDS: "${INGEST_FLOOR_WINDOW_SECONDS:-12}"
      ROLLUP_RETENTION_DAYS: "${ROLLUP_RETENTION_DAYS:-${RETENTION_DAYS:-30}}"
      # Expensive aggregates allowed to execute at once. Postgres has one core,
      # so this is not a parallelism setting — it is the cap that stops
      # analytical reads taking the core away from ingestion and from GET /logs.
      # Kept well below DB_POOL_MAX so paged reads always have connections left.
      AGGREGATE_CONCURRENCY: "${AGGREGATE_CONCURRENCY:-2}"
      # Aggregates the rollup cannot serve at all (q, attr.*) read every raw
      # row in the requested range, so they are held to one at a time. This is
      # the limit that protects ingestion; the one above only paces the cheap
      # queries, which must not queue behind an unbounded scan.
      AGGREGATE_SCAN_CONCURRENCY: "${AGGREGATE_SCAN_CONCURRENCY:-1}"
    ports:
      - "8080:8080"
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  pgdata:
